
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label PDF Sorter</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Label PDF Sorter</h1>
    <p>Sort shipping labels by SKU.</p>

    <h2>Step 1: Upload PDF Files</h2>

    <label>Shipping Labels:</label>
    <input type="file" id="labels" accept=".pdf">

    <br><br>

    <label>Pick Tickets:</label>
    <input type="file" id="tickets" accept=".pdf">

    <br><br>

    <button id="analyze">Analyze PDFs</button>
</body>
</html>
